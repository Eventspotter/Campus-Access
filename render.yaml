services:
  - type: web
    name: campus-access
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --prefix server --omit=dev && npm ci --prefix client --include=dev && npm run build --prefix client
    startCommand: npm run seed --prefix server && npm start --prefix server
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: '10000'
      - key: APP_ORIGIN
        fromService:
          name: campus-access
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        value: mongodb+srv://campusaccess.oazovsi.mongodb.net/campus_access?authSource=admin
      - key: MONGODB_USER
        value: admin
      - key: MONGODB_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Campus Administrator
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
